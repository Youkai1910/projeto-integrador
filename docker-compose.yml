services:
  web:
    image: nginx:alpine
    container_name: pi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: pi_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=biblia_catolica
      - DB_USER=root
      - DB_PASSWORD=senacpenha
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: pi_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: senacpenha
      MYSQL_DATABASE: biblia_catolica
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
